log_format local_request '[$time_local] "$request_method $uri" $status';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log local_request;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend http://frontend:80;
    set $gateway http://api-gateway:8080;
    set $keycloak http://keycloak:8080;

    location = /auth/callback {
        proxy_pass $frontend/index.html;
    }

    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /realms/investitrack/ {
        proxy_pass $keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /resources/ {
        proxy_pass $keycloak;
    }

    location ~ ^/(admin|metrics|health|actuator|internal|realms/master)(/|$) {
        return 404;
    }

    location / {
        proxy_pass $frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
