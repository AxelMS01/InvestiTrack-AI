services:
  project-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: project_db
      POSTGRES_USER: ${DATABASE_USERNAME:-project}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.docker}
    volumes:
      - project-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [investitrack]
  project-service:
    build: .
    image: investitrack-project:local
    container_name: project-service
    env_file: .env.docker
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      project-postgres:
        condition: service_healthy
    networks: [investitrack]
    restart: unless-stopped
volumes:
  project-postgres-data:
networks:
  investitrack:
    external: true
