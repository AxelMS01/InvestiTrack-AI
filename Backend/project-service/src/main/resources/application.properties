spring.application.name=project-service
server.port=${PORT:8083}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/project_db}
spring.datasource.username=${DATABASE_USERNAME:project}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/investitrack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8180/realms/investitrack/protocol/openid-connect/certs}
project.security.audience=${OIDC_AUDIENCE:research-platform-api}
project.security.internal-audience=${OIDC_INTERNAL_AUDIENCE:project-service}
project.security.workload-clients=${PROJECT_WORKLOAD_CLIENTS:identity-service,proposal-service,document-service,ai-service,reporting-service}
project.owners.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
project.owners.identity.token=${IDENTITY_SERVICE_TOKEN:}
project.owners.proposal.url=${PROPOSAL_SERVICE_URL:http://localhost:8082}
project.owners.proposal.token=${PROPOSAL_SERVICE_TOKEN:}
project.owners.document.url=${DOCUMENT_SERVICE_URL:http://localhost:8084}
project.owners.document.token=${DOCUMENT_SERVICE_TOKEN:}
project.token-exchange.uri=${TOKEN_EXCHANGE_URI:}
project.token-exchange.client-id=${TOKEN_EXCHANGE_CLIENT_ID:project-execution-service}
project.token-exchange.client-secret=${TOKEN_EXCHANGE_CLIENT_SECRET:}
project.token-exchange.document-audience=${DOCUMENT_AUDIENCE:document-service}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:project}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=1s
project.messaging.enabled=${MESSAGING_ENABLED:false}
project.jobs.enabled=${JOBS_ENABLED:true}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
