services:
  document-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: document_db
      POSTGRES_USER: ${DATABASE_USERNAME:-document}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.docker}
    volumes:
      - document-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [investitrack]
  document-service:
    build: .
    image: investitrack-document:local
    env_file: .env.docker
    ports: ["127.0.0.1:8084:8084"]
    depends_on:
      document-postgres:
        condition: service_healthy
    networks: [investitrack]
    restart: unless-stopped
volumes:
  document-postgres-data:
networks:
  investitrack:
    external: true
