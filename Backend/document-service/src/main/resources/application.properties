spring.application.name=document-service
server.port=${PORT:8084}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/document_db}
spring.datasource.username=${DATABASE_USERNAME:document}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/investitrack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8180/realms/investitrack/protocol/openid-connect/certs}
document.security.audience=${OIDC_AUDIENCE:research-platform-api}
document.security.internal-audience=${OIDC_INTERNAL_AUDIENCE:document-service}
document.security.workload-clients=${DOCUMENT_WORKLOAD_CLIENTS:identity-service,project-execution-service,project-service,malware-scanner,text-extractor,ai-service}
document.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
document.identity.token=${IDENTITY_SERVICE_TOKEN:}
document.project.url=${PROJECT_SERVICE_URL:http://localhost:8083}
document.project.token=${PROJECT_SERVICE_TOKEN:}
document.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
document.storage.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}
document.storage.region=${S3_REGION:us-east-1}
document.storage.bucket=${S3_BUCKET:documents}
document.storage.access-key=${S3_ACCESS_KEY:}
document.storage.secret-key=${S3_SECRET_KEY:}
document.upload.max-bytes=${MAX_UPLOAD_BYTES:52428800}
document.scan.callback-secret=${SCAN_CALLBACK_SECRET:}
document.jobs.enabled=${JOBS_ENABLED:true}
document.messaging.enabled=${MESSAGING_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:document}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
