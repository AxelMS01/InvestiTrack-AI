services:
  proposal-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: proposal_db
      POSTGRES_USER: ${DATABASE_USERNAME:-proposal}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.docker}
    volumes:
      - proposal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [investitrack]
  proposal-service:
    build: .
    image: investitrack-proposal:local
    container_name: proposal-service
    env_file: .env.docker
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      proposal-postgres:
        condition: service_healthy
    networks: [investitrack]
    restart: unless-stopped
volumes:
  proposal-postgres-data:
networks:
  investitrack:
    external: true
