spring.application.name=proposal-service
server.port=${PORT:8082}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/proposal_db}
spring.datasource.username=${DATABASE_USERNAME:proposal}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/investitrack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8180/realms/investitrack/protocol/openid-connect/certs}
proposal.security.audience=${OIDC_AUDIENCE:research-platform-api}
proposal.security.internal-audience=${OIDC_INTERNAL_AUDIENCE:proposal-service}
proposal.security.workload-clients=${PROPOSAL_WORKLOAD_CLIENTS:project-execution-service,identity-service,document-service,reporting-service}
proposal.owners.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
proposal.owners.identity.token=${IDENTITY_SERVICE_TOKEN:}
proposal.owners.document.url=${DOCUMENT_SERVICE_URL:http://localhost:8084}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:proposal}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=1s
proposal.messaging.enabled=${MESSAGING_ENABLED:false}
proposal.jobs.enabled=${JOBS_ENABLED:true}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
