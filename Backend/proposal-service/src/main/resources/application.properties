spring.application.name=proposal-service
server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus

spring.datasource.url=jdbc:postgresql://localhost:5432/proposal_db
spring.datasource.username=proposal_user
spring.datasource.password=213097

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Configure institutional tokens with a mapped application UUID in the signed user_id claim.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8080/realms/research}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8080/realms/research/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE:proposal-service}
management.endpoint.health.probes.enabled=true
