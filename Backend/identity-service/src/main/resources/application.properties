spring.application.name=identity-service
server.port=${PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/identity_db}
spring.datasource.username=proposal_user
spring.datasource.password=213097

spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8080/realms/investitrack}
identity.security.audience=${OIDC_AUDIENCE:research-platform-api}
identity.security.internal-audience=${OIDC_INTERNAL_AUDIENCE:identity-service}
identity.security.workload-clients=${IDENTITY_WORKLOAD_CLIENTS:proposal-service,project-execution-service,document-service,ai-service,reporting-service}
identity.owners.project.url=${PROJECT_SERVICE_URL:}
identity.owners.project.token=${PROJECT_SERVICE_TOKEN:}
identity.owners.proposal.url=${PROPOSAL_SERVICE_URL:}
identity.owners.proposal.token=${PROPOSAL_SERVICE_TOKEN:}
identity.owners.document.url=${DOCUMENT_SERVICE_URL:}
identity.owners.document.token=${DOCUMENT_SERVICE_TOKEN:}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:identity}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=1s
identity.outbox.enabled=${OUTBOX_ENABLED:true}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.group.readiness.include=readinessState,db
identity.bootstrap.subject=${IDENTITY_BOOTSTRAP_SUBJECT:}
identity.bootstrap.email=${IDENTITY_BOOTSTRAP_EMAIL:}
identity.bootstrap.display-name=${IDENTITY_BOOTSTRAP_NAME:Administrator}
