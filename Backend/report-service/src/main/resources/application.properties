spring.application.name=report-service
server.port=${PORT:8085}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reporting_db}
spring.datasource.username=${DATABASE_USERNAME:reporting}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/investitrack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8180/realms/investitrack/protocol/openid-connect/certs}
report.security.audience=${OIDC_AUDIENCE:research-platform-api}
report.security.internal-audience=${OIDC_INTERNAL_AUDIENCE:report-service}
report.security.workload-clients=${REPORT_WORKLOAD_CLIENTS:reporting-admin}
report.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
report.identity.token=${IDENTITY_SERVICE_TOKEN:}
report.project.url=${PROJECT_SERVICE_URL:http://localhost:8083}
report.project.token=${PROJECT_SERVICE_TOKEN:}
report.proposal.url=${PROPOSAL_SERVICE_URL:http://localhost:8082}
report.proposal.token=${PROPOSAL_SERVICE_TOKEN:}
report.jobs.enabled=${JOBS_ENABLED:true}
report.messaging.enabled=${MESSAGING_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:reporting}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.listener.simple.default-requeue-rejected=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
