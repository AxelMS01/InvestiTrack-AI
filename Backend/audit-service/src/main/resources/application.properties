spring.application.name=audit-service
server.port=${PORT:8087}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/audit_db}
spring.datasource.username=${DATABASE_USERNAME:audit_runtime}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/investitrack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8180/realms/investitrack/protocol/openid-connect/certs}
audit.security.audience=${OIDC_AUDIENCE:research-platform-api}
audit.security.internal-audience=${OIDC_INTERNAL_AUDIENCE:audit-service}
audit.security.workload-clients=${AUDIT_WORKLOAD_CLIENTS:identity-service,proposal-service,project-execution-service,document-service,ai-service,reporting-service,idp-audit-adapter}
audit.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
audit.identity.token=${IDENTITY_SERVICE_TOKEN:}
audit.jobs.enabled=${JOBS_ENABLED:true}
audit.messaging.enabled=${MESSAGING_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:audit}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=5
spring.rabbitmq.listener.simple.retry.max-interval=600s
spring.rabbitmq.listener.simple.retry.max-retries=5
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
