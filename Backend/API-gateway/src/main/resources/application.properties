spring.application.name=api-gateway
server.port=${PORT:8080}
spring.main.web-application-type=reactive
server.max-http-request-header-size=16KB
server.netty.connection-timeout=3s
spring.http.codecs.max-in-memory-size=1MB

# Explicit JWK URI avoids an IdP network call during startup. Issuer is still validated.
gateway.issuer=${OIDC_ISSUER_URI:http://localhost:8180/realms/investitrack}
gateway.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8180/realms/investitrack/protocol/openid-connect/certs}
gateway.audience=${OIDC_AUDIENCE:research-platform-api}
gateway.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
gateway.max-request-bytes=${MAX_REQUEST_BYTES:10485760}
gateway.rate-limit.requests=${RATE_LIMIT_REQUESTS:120}
gateway.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
gateway.rate-limit.max-subjects=${RATE_LIMIT_MAX_SUBJECTS:10000}

gateway.services.identity=${IDENTITY_SERVICE_URL:http://localhost:8081}
gateway.services.proposal=${PROPOSAL_SERVICE_URL:http://localhost:8082}
gateway.services.project=${PROJECT_SERVICE_URL:http://localhost:8083}
gateway.services.document=${DOCUMENT_SERVICE_URL:http://localhost:8084}
gateway.services.reporting=${REPORTING_SERVICE_URL:http://localhost:8085}
gateway.services.ai=${AI_SERVICE_URL:http://localhost:8086}
gateway.services.audit=${AUDIT_SERVICE_URL:http://localhost:8087}
gateway.services.notification=${NOTIFICATION_SERVICE_URL:http://localhost:8088}

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=1000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s
# AI streaming uses a longer response budget; no response buffering or automatic retries.
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=30s
spring.cloud.gateway.server.webflux.metrics.enabled=true

# Operational endpoints are isolated from the public listener.
management.server.port=${MANAGEMENT_PORT:9090}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
